name: NEXO 9.8 LAB UI Static Check

on:
  push:
    branches: [main, 9.8-lab-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ui-static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: JavaScript syntax check
        run: node --check ui/app.js
      - name: Static security and UX sweep
        run: node tests/ui_static_check.mjs

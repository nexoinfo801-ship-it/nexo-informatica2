<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXO ERP PRO 9.8 LAB — Cliente</title><style>:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#eef5ff;background:#070b12}*{box-sizing:border-box}body{margin:0;display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{padding:20px;background:#0b1421;border-right:1px solid #1b2a3d}.brand{font-size:22px;font-weight:800;color:#0a84ff;margin-bottom:24px}.brand span{color:#fff}nav{display:grid;gap:7px}nav button{border:0;background:transparent;color:#a9b6c7;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer}nav button:hover,nav button.active{background:#10233c;color:#fff}main{padding:20px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.status{color:#7f91a9;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:#0e1623;border:1px solid #1b2a3d;border-radius:14px;padding:16px}.panel{margin-top:14px}.card h3{margin:0 0 8px;font-size:13px;color:#8ea0b7}.card strong{font-size:24px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#14243b;color:#b8c7da;font-size:12px}.ok{color:#22c55e}.warn{color:#f59e0b}.danger{color:#ef4444}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #1b2a3d;font-size:13px}@media(max-width:900px){body{grid-template-columns:190px 1fr}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){body{display:block}.grid{grid-template-columns:1fr}}</style></head><body><aside class="side"><div class="brand">NEXO <span>ERP PRO</span></div><nav id="nav"><button data-page="dashboard">Dashboard</button><button data-page="pdv">PDV</button><button data-page="pedidos">Pedidos / Salão</button><button data-page="produtos">Produtos</button><button data-page="estoque">Estoque / Suprimentos</button><button data-page="caixa">Caixa</button><button data-page="financeiro">Financeiro</button><button data-page="delivery">Delivery</button><button data-page="aprender">NEXO Aprender</button><button data-page="ia">NEXO Intelligence</button><button data-page="suporte">Licença / Suporte</button></nav></aside><main><header><strong id="title">Dashboard</strong><span class="status">9.8 LAB • CLIENTE • SEM SEGREDOS MASTER</span></header><section id="content"></section></main><script>(()=>{'use strict';const title=document.getElementById('title'),content=document.getElementById('content'),nav=document.getElementById('nav');const pages={dashboard:['Dashboard','<div class="grid"><div class="card"><h3>Vendas hoje</h3><strong>R$ 1.842,00</strong></div><div class="card"><h3>Recebido hoje</h3><strong>R$ 1.715,00</strong></div><div class="card"><h3>Pedidos</h3><strong>38</strong></div><div class="card"><h3>Alertas</h3><strong class="warn">4</strong></div></div><div class="panel"><h2>Saúde Operacional</h2><p><span class="ok">● Banco OK</span> · Backup diário: contrato LAB · Licença: LAB</p></div>'],pdv:['PDV','<div class="panel"><h2>PDV</h2><p>Venda, código de barras, pagamentos múltiplos, troco e reserva de estoque.</p><span class="pill">Fluxo demonstrativo — sem persistência comercial</span></div>'],pedidos:['Pedidos / Salão','<div class="panel"><h2>Salão + Garçom Mobile + Cozinha/Bar</h2><p>Mesa → pedido único → roteador → cozinha/bar → pronto → caixa.</p><p>Idempotência, estados controlados e auditoria em cada transição.</p></div>'],produtos:['Produtos','<div class="panel"><h2>Produtos 360</h2><table><tr><th>Produto</th><th>Custo</th><th>Venda</th><th>Margem</th><th>Markup</th></tr><tr><td>Marmita Grande</td><td>R$ 12,00</td><td>R$ 29,90</td><td>59,87%</td><td>149,17%</td></tr></table><p>Ficha técnica, fornecedor, barcode, validade e etiquetas.</p></div>'],estoque:['Estoque / Suprimentos','<div class="panel"><h2>Estoque / Suprimentos</h2><p>Físico, reservado, disponível, em trânsito, mínimo, segurança, FEFO e sugestão de compra.</p><p class="danger">Alerta: 2 itens abaixo do estoque mínimo.</p></div>'],caixa:['Caixa','<div class="panel"><h2>Caixa</h2><p>Dinheiro físico separado de PIX, cartão e marketplace. Sangria, suprimento e fechamento auditados.</p></div>'],financeiro:['Financeiro','<div class="panel"><h2>Financeiro</h2><p>Recebimentos 360, aging, fluxo de caixa, contas, conciliação e DRE.</p></div>'],delivery:['NEXO Delivery','<div class="panel"><h2>NEXO Delivery</h2><p>PEDIDO → PRODUÇÃO → EXPEDIÇÃO → ROTA → ENTREGA → PAGAMENTO → FINALIZAÇÃO.</p><p>Entregador Mobile recebe somente suas entregas. Taxas por bairro, ocorrências, acerto e tempo de rota.</p></div>'],aprender:['NEXO Aprender','<div class="panel"><h2>NEXO Aprender</h2><p><strong>ENTENDER → EXECUTAR → CORRIGIR → APERFEIÇOAR</strong></p><p>Modo guiado, tutoriais versionados, ajuda contextual, progresso e integração com Suporte.</p></div>'],ia:['NEXO Intelligence','<div class="panel"><h2>NEXO Intelligence</h2><p>OBSERVAR → ANALISAR → SUGERIR → PEDIR AUTORIZAÇÃO → REGISTRAR.</p><p class="warn">A IA não executa ação crítica por conta própria.</p></div>'],suporte:['Licença / Suporte / Backup','<div class="panel"><h2>Licença / Suporte / Backup</h2><p>Heartbeat, diagnóstico, chamados, backup diário, histórico e restauração testável.</p><p class="warn">Este arquivo cliente não contém chave privada, ADMIN_TOKEN ou credenciais Master.</p></div>']};function open(k){if(!pages[k])k='dashboard';title.textContent=pages[k][0];content.innerHTML=pages[k][1];for(const b of nav.querySelectorAll('button'))b.classList.toggle('active',b.dataset.page===k)}nav.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)open(b.dataset.page)});open('dashboard')})();</script></body></html>

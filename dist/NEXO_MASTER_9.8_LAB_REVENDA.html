<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXO MASTER 9.8 LAB — Revenda</title><style>:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#f3f7ff;background:#060a10}*{box-sizing:border-box}body{margin:0;display:grid;grid-template-columns:250px 1fr;min-height:100vh}aside{background:#0a1220;padding:22px;border-right:1px solid #1d2b40}h1{font-size:22px;color:#0a84ff}h1 span{color:#fff}nav{display:grid;gap:7px}nav button{padding:11px;border:0;border-radius:9px;text-align:left;color:#aab8ca;background:transparent;cursor:pointer}nav button.active,nav button:hover{background:#112642;color:#fff}main{padding:22px}header{display:flex;justify-content:space-between;margin-bottom:20px;color:#8798ad}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#0d1725;border:1px solid #1d2b40;border-radius:14px;padding:16px}.panel{margin-top:14px}.card small{color:#8ca0b8}.card strong{display:block;font-size:26px;margin-top:7px}.ok{color:#22c55e}.warn{color:#f59e0b}.danger{color:#ef4444}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #1d2b40;text-align:left;font-size:13px}@media(max-width:850px){body{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><aside><h1>NEXO <span>MASTER</span></h1><nav id="nav"><button data-p="dashboard">Visão Geral</button><button data-p="clientes">Clientes</button><button data-p="licencas">Licenças</button><button data-p="receita">Receita Recorrente</button><button data-p="backups">Backups</button><button data-p="suporte">Suporte</button><button data-p="releases">Releases</button><button data-p="intelligence">Intelligence</button><button data-p="drivers">Drivers</button><button data-p="aprender">Aprender</button><button data-p="auditoria">Auditoria</button></nav></aside><main><header><strong id="title">Visão Geral</strong><span>REVENDA • 9.8 LAB • PLACEHOLDERS SEM SEGREDOS</span></header><section id="content"></section></main><script>(()=>{'use strict';const c=document.getElementById('content'),t=document.getElementById('title'),nav=document.getElementById('nav');const views={dashboard:['Visão Geral','<div class="grid"><div class="card"><small>Clientes ativos</small><strong>187</strong></div><div class="card"><small>MRR</small><strong>R$ 18.700</strong></div><div class="card"><small>Backups OK</small><strong class="ok">183</strong></div><div class="card"><small>Alertas</small><strong class="warn">14</strong></div></div><div class="panel"><h2>Saúde da rede NEXO</h2><p>Heartbeat, versões, backups, licenças e chamados em visão agregada.</p></div>'],clientes:['Clientes','<div class="panel"><h2>Cliente 360</h2><table><tr><th>Cliente</th><th>Plano</th><th>Uso</th><th>Saúde</th></tr><tr><td>Marmitaria DEMO A</td><td>Profissional</td><td>Alta</td><td class="ok">OK</td></tr><tr><td>Restaurante DEMO B</td><td>Básico</td><td>Média</td><td class="warn">Atenção</td></tr></table></div>'],licencas:['Licenças','<div class="panel"><h2>Licenças e Dispositivos</h2><p>Ativar, renovar, revogar individualmente, controlar máquinas e acompanhar ACK/heartbeat.</p><p>Falha de internet não equivale a revogação.</p></div>'],receita:['Receita Recorrente','<div class="panel"><h2>MRR / ARR / Cobrança</h2><p>Mensalidades idempotentes por licença + referência, inadimplência, renovação, churn e retenção.</p></div>'],backups:['Backups','<div class="panel"><h2>Backup & Recovery</h2><p>Histórico, SHA-256, integridade, retenção, status e teste de restauração em nova máquina.</p></div>'],suporte:['Suporte','<div class="panel"><h2>Suporte 360</h2><p>Protocolos, SLA, categoria, prioridade, mensagens e diagnóstico com contexto mínimo.</p></div>'],releases:['Releases','<div class="panel"><h2>Stable / Beta</h2><p>Rollout controlado, versão mínima, manifesto assinado, SHA-256 e rollback.</p></div>'],intelligence:['NEXO Intelligence','<div class="panel"><h2>Intelligence</h2><p>Métricas agregadas, saúde, uso, riscos e recomendações.</p><p class="warn">IA não revoga licença, restaura backup ou executa ação crítica autonomamente.</p></div>'],drivers:['Drivers','<div class="panel"><h2>Catálogo de Drivers</h2><p>Fontes oficiais, modelo, versão, SO, arquitetura, assinatura/hash e status de homologação.</p></div>'],aprender:['NEXO Aprender','<div class="panel"><h2>Conteúdo e Treinamento</h2><p>Artigos e tutoriais versionados: RASCUNHO → REVISÃO → APROVADO → PUBLICADO.</p><p>Progresso, dúvidas frequentes e aprendizado com soluções do suporte.</p></div>'],auditoria:['Auditoria','<div class="panel"><h2>Auditoria Master</h2><p>Ações administrativas críticas com usuário, data/hora, entidade, before/after e correlação.</p><p class="danger">Este protótipo NÃO contém chaves privadas, ADMIN_TOKEN, SMTP, WhatsApp token ou credenciais reais.</p></div>']};function open(k){if(!views[k])k='dashboard';t.textContent=views[k][0];c.innerHTML=views[k][1];for(const b of nav.querySelectorAll('button'))b.classList.toggle('active',b.dataset.p===k)}nav.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b)open(b.dataset.p)});open('dashboard')})();</script></body></html>
